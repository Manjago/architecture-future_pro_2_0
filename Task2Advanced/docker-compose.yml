# -----------------------------------------------------------------------------
# MinIO — локальное S3-совместимое хранилище для Terraform remote state
# -----------------------------------------------------------------------------

services:
  minio:
    image: minio/minio:latest
    container_name: terraform-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "managed-by=terraform-lab"
      - "purpose=remote-state"

volumes:
  minio-data:
