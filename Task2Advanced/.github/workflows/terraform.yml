# -----------------------------------------------------------------------------
# CI/CD pipeline для Terraform
#
# Триггеры:
#   - Pull Request → validate + plan (без apply)
#   - Push в main  → validate + plan + apply (с ручным подтверждением для prod)
#
# Секреты (GitHub Settings → Secrets):
#   - MINIO_ACCESS_KEY — access key для MinIO / S3
#   - MINIO_SECRET_KEY — secret key для MinIO / S3
#   - MINIO_ENDPOINT   — endpoint MinIO (например, http://minio:9000)
#
# Примечание:
#   Для локального запуска используйте скрипты из scripts/.
#   Этот workflow предназначен для GitHub-hosted или self-hosted runners
#   с доступом к MinIO и Docker.
# -----------------------------------------------------------------------------

name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Task2Advanced/**'
      - 'Task1Advanced/modules/**'
  pull_request:
    branches: [main]
    paths:
      - 'Task2Advanced/**'
      - 'Task1Advanced/modules/**'

# Не запускать параллельные pipeline для одного окружения
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_WORKING_DIR: Task2Advanced
  AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}

jobs:
  # =========================================================================
  # Validate — проверка синтаксиса и форматирования
  # =========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (validate only)
        run: |
          terraform init \
            -backend=false

      - name: Terraform Validate
        run: terraform validate

  # =========================================================================
  # Plan — для каждого окружения
  # =========================================================================
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    strategy:
      matrix:
        environment: [dev, stage, prod]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="envs/${{ matrix.environment }}.tfvars" \
            -out="tfplan-${{ matrix.environment }}"

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan-${{ matrix.environment }}
          retention-days: 5

  # =========================================================================
  # Apply Dev — автоматически при push в main
  # =========================================================================
  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=dev/terraform.tfstate"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-dev

  # =========================================================================
  # Apply Stage — автоматически при push в main
  # =========================================================================
  apply-stage:
    name: Apply (stage)
    runs-on: ubuntu-latest
    needs: apply-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: stage
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-stage
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=stage/terraform.tfstate"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-stage

  # =========================================================================
  # Apply Prod — РУЧНОЕ подтверждение (environment protection rules)
  # =========================================================================
  apply-prod:
    name: Apply (prod) — requires approval
    runs-on: ubuntu-latest
    needs: apply-stage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # Requires manual approval in GitHub Settings
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=prod/terraform.tfstate"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-prod
